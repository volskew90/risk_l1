[project]
name = "risk-l1"
version = "0.1.0"
description = "IA Monitor - Security Data and Initial Amount Calculator"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "openpyxl>=3.0",
    "pyyaml>=6.0",
    "pytest>=7.0",
    "exchange-calendars>=4.5",
]

# 注：Windows 生产环境若使用 iFinDPy SDK，需从同花顺官方客户端本地目录手动 pip install，不在 PyPI 索引中
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
